<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>마마코인 부루마블</title>
<!-- 마마코인 부루마블 v2. 소스: 부루마블_작업/v2/src/ → build.py (이 파일을 직접 고치지 말 것) -->
<script>(function(){try{var q=new URLSearchParams(location.search),d=document.documentElement,t=q.get('theme');if(t!=='light'&&t!=='dark'){try{t=localStorage.getItem('mk_marble_theme_v1')}catch(e){t=null}}if(t==='light'||t==='dark')d.dataset.theme=t;}catch(e){}})();</script>
<style>
/* 마마코인 부루마블 v2 — 스타일(딸기우유 · 평면 · 라이트/다크). 색은 토큰만. 다크 토큰은 build.py가 두 번 펼친다.
   포인트 색(작업방 mk_accent_v1 · ?accent=)은 app.js가 --acc3rgb/--acc2rgb/--acc-text-l·d/--on-acc-l·d/--tint-* 를 :root 인라인에 넣는다(없으면 기본 핑크). */
:root{
  --acc3rgb:255,119,184; --acc2rgb:255,182,214;
  --acc:rgb(var(--acc3rgb)); --acc2:rgb(var(--acc2rgb));
  --page:var(--tint-page,#FFF5FA); --dots:rgba(var(--tint-dots,190,110,150),.16);
  --surface:#FFFFFF; --surface2:var(--tint-surface2,#FFF4F9); --sunken:var(--tint-sunken,#FDF1F7);
  --line:var(--tint-line,#F1DCE7); --line2:var(--tint-line2,#E8C9D9);
  --text:#2B2230; --text2:#5F5059; --text3:#8A7984;
  --acc-text:var(--acc-text-l,#B0397A); --acc-soft:rgba(var(--acc3rgb),.14); --acc-ring:rgba(var(--acc3rgb),.6);
  --on-acc:var(--on-acc-l,#1B1020);
  --btn-top:var(--btn-top-l,#FF9ACB); --btn-bot:var(--btn-bot-l,#FF77B8); --btn-edge:var(--btn-edge-l,#D9579A); --btn-glow:rgba(var(--acc3rgb),.35);
  --btn2-bg:#FFFFFF; --btn2-edge:var(--tint-line2,#EBCFDD);
  --good:#18925F; --bad:#D6335C; --warn:#A96A00; --info:#3A6FB0;
  --shadow:0 18px 50px rgba(var(--tint-shadow,60,20,40),.16), 0 2px 8px rgba(var(--tint-shadow,60,20,40),.06);
  --shadow-sm:0 6px 18px rgba(var(--tint-shadow,60,20,40),.10);
  --card-border:1px solid var(--line);
  --board-bg:linear-gradient(155deg,var(--tint-board1,#FFE0EF) 0%,var(--tint-board2,#FFF0F7) 48%,#E6F4FF 100%);
  --board-border:1px solid var(--tint-line,#F6D3E4);
  --board-shadow:0 22px 60px rgba(var(--tint-shadow,170,70,120),.16), inset 0 0 0 3px rgba(255,255,255,.75);
  --center-bg:rgba(255,255,255,.58); --center-line:rgba(255,255,255,.9);
  --tile:#FFFFFF; --tile-border:1px solid #F3E0EA; --tile-edge:#EFD3E1;
  --tile-shadow:0 2px 0 var(--tile-edge), 0 5px 12px rgba(150,60,110,.08);
  --t0:#FFBE9E; --t1:#FFDC78; --t2:#95DFC3; --t3:#98CBFF; --t4:#C0ADFF; --t5:#FFA3CB;
  --ti0:#CF6236; --ti1:#A87B00; --ti2:#23906A; --ti3:#3276C4; --ti4:#6A4DD0; --ti5:#C93D84;
  --tf0:#FFE3D4; --tf1:#FFF0BF; --tf2:#D6F4E8; --tf3:#D9ECFF; --tf4:#E7DFFF; --tf5:#FFDCEC;
  --ev:#FFF6FA; --evi:#C0457F; --evf:#FFD9EA;
  --rest:#F3EFFF; --resti:#6B53C9; --restf:#E0D6FF;
  --start-bg:linear-gradient(160deg,#FFD0E6,#FFE9C9);
  --coin:#FFD25A; --coin-edge:#E3A21A; --coin-ink:#8F5B00;
  --wcoin:#E7A400;
  --scrim:rgba(43,34,48,.30);
  --tok-line:1.6;
  --font:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
  --page:#0F0E13; --dots:rgba(255,255,255,.06);
  --surface:#1D1B23; --surface2:#24212C; --sunken:#16141B;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.17);
  --text:rgba(255,255,255,.93); --text2:rgba(255,255,255,.72); --text3:rgba(255,255,255,.55);
  --acc-text:var(--acc-text-d,#FFB3D5); --acc-soft:rgba(var(--acc3rgb),.18); --acc-ring:rgba(var(--acc2rgb),.65);
  --on-acc:var(--on-acc-d,#1B1020);
  --btn-top:var(--btn-top-d,#FF93C6); --btn-bot:var(--btn-bot-d,#F56BAA); --btn-edge:var(--btn-edge-d,#A23668); --btn-glow:rgba(var(--acc3rgb),.22);
  --btn2-bg:#26232E; --btn2-edge:#111015;
  --good:#5FE0A6; --bad:#FF7394; --warn:#FFC766; --info:#8FC2FF;
  --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-sm:0 6px 18px rgba(0,0,0,.35);
  --card-border:1px solid rgba(255,255,255,.08);
  --board-bg:linear-gradient(155deg,#2C1D2B 0%,#201B28 50%,#172233 100%);
  --board-border:1px solid rgba(255,255,255,.08);
  --board-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04);
  --center-bg:rgba(0,0,0,.20); --center-line:rgba(255,255,255,.14);
  --tile:#28252F; --tile-border:1px solid rgba(255,255,255,.06); --tile-edge:#121016;
  --tile-shadow:0 2px 0 var(--tile-edge), 0 5px 12px rgba(0,0,0,.28);
  --t0:#E9A081; --t1:#E8C45E; --t2:#6FC9A8; --t3:#78AEEA; --t4:#A590EC; --t5:#EA86B4;
  --ti0:#FFBC9E; --ti1:#FFDD85; --ti2:#90E6C5; --ti3:#A8D1FF; --ti4:#CBBBFF; --ti5:#FFB0D3;
  --tf0:rgba(255,160,120,.2); --tf1:rgba(255,210,90,.17); --tf2:rgba(110,210,170,.17); --tf3:rgba(120,175,240,.2); --tf4:rgba(165,145,236,.22); --tf5:rgba(234,134,180,.22);
  --ev:#2B2430; --evi:#FFB3D5; --evf:rgba(255,119,184,.24);
  --rest:#262238; --resti:#CDBEFF; --restf:rgba(155,120,255,.26);
  --start-bg:linear-gradient(160deg,#5C2B47,#5A4424);
  --coin:#FFD25A; --coin-edge:#E3A21A; --coin-ink:#8F5B00; --wcoin:#FFC83D;
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
}
:root[data-theme="dark"]{
  --page:#0F0E13; --dots:rgba(255,255,255,.06);
  --surface:#1D1B23; --surface2:#24212C; --sunken:#16141B;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.17);
  --text:rgba(255,255,255,.93); --text2:rgba(255,255,255,.72); --text3:rgba(255,255,255,.55);
  --acc-text:var(--acc-text-d,#FFB3D5); --acc-soft:rgba(var(--acc3rgb),.18); --acc-ring:rgba(var(--acc2rgb),.65);
  --on-acc:var(--on-acc-d,#1B1020);
  --btn-top:var(--btn-top-d,#FF93C6); --btn-bot:var(--btn-bot-d,#F56BAA); --btn-edge:var(--btn-edge-d,#A23668); --btn-glow:rgba(var(--acc3rgb),.22);
  --btn2-bg:#26232E; --btn2-edge:#111015;
  --good:#5FE0A6; --bad:#FF7394; --warn:#FFC766; --info:#8FC2FF;
  --shadow:0 18px 50px rgba(0,0,0,.55); --shadow-sm:0 6px 18px rgba(0,0,0,.35);
  --card-border:1px solid rgba(255,255,255,.08);
  --board-bg:linear-gradient(155deg,#2C1D2B 0%,#201B28 50%,#172233 100%);
  --board-border:1px solid rgba(255,255,255,.08);
  --board-shadow:0 22px 60px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04);
  --center-bg:rgba(0,0,0,.20); --center-line:rgba(255,255,255,.14);
  --tile:#28252F; --tile-border:1px solid rgba(255,255,255,.06); --tile-edge:#121016;
  --tile-shadow:0 2px 0 var(--tile-edge), 0 5px 12px rgba(0,0,0,.28);
  --t0:#E9A081; --t1:#E8C45E; --t2:#6FC9A8; --t3:#78AEEA; --t4:#A590EC; --t5:#EA86B4;
  --ti0:#FFBC9E; --ti1:#FFDD85; --ti2:#90E6C5; --ti3:#A8D1FF; --ti4:#CBBBFF; --ti5:#FFB0D3;
  --tf0:rgba(255,160,120,.2); --tf1:rgba(255,210,90,.17); --tf2:rgba(110,210,170,.17); --tf3:rgba(120,175,240,.2); --tf4:rgba(165,145,236,.22); --tf5:rgba(234,134,180,.22);
  --ev:#2B2430; --evi:#FFB3D5; --evf:rgba(255,119,184,.24);
  --rest:#262238; --resti:#CDBEFF; --restf:rgba(155,120,255,.26);
  --start-bg:linear-gradient(160deg,#5C2B47,#5A4424);
  --coin:#FFD25A; --coin-edge:#E3A21A; --coin-ink:#8F5B00; --wcoin:#FFC83D;
  --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}


*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; min-height:100dvh;
  background-color:var(--page);
  background-image:radial-gradient(var(--dots) 1.3px, transparent 1.8px); background-size:22px 22px;
  color:var(--text); font-family:var(--font); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none; padding:0; margin:0}
button:disabled{cursor:not-allowed}
input{font:inherit; color:var(--text)}
:focus-visible{outline:2.5px solid var(--acc-ring); outline-offset:2px}
img{display:block; max-width:100%}
.mkIc{width:1.15em; height:1.15em; flex:0 0 auto; display:inline-block; vertical-align:-.2em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; overflow:visible; pointer-events:none}
.mkIc .pip{fill:currentColor; stroke:none}
.mkIc .dot{fill:#FF5A7A; stroke:none}
.mkIc .f{fill:var(--icf,none); stroke:none}
.av,.tok .body,.winAv{container-type:size}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none !important}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ── 버튼 ── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.45em;
  min-height:44px; padding:0 18px; border-radius:999px;
  font-weight:800; font-size:15px; letter-spacing:-.01em; white-space:nowrap;
  background:var(--btn2-bg); color:var(--text); border:var(--card-border); box-shadow:0 3px 0 var(--btn2-edge);
  transition:transform .08s ease, box-shadow .08s ease, filter .15s ease, opacity .15s ease;
  user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.btn:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 var(--btn2-edge)}
.btn.primary{background:linear-gradient(180deg,var(--btn-top),var(--btn-bot)); color:var(--on-acc); border-color:transparent; box-shadow:0 4px 0 var(--btn-edge), 0 10px 22px var(--btn-glow)}
.btn.primary:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 var(--btn-edge), 0 4px 10px var(--btn-glow)}
.btn.danger{color:var(--bad)}
.btn.big{min-height:58px; font-size:18.5px; border-radius:20px; padding:0 20px}
.btn.big .mkIc{width:1.35em; height:1.35em}
.btn.ghost{background:transparent; box-shadow:none}
.btn.small{min-height:34px; padding:0 12px; font-size:13px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5; filter:grayscale(.4); box-shadow:none; transform:none}
.btn.shine{position:relative; overflow:hidden}
.btn.shine::after{content:""; position:absolute; top:-40%; bottom:-40%; width:38%; left:-50%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:skewX(-20deg); animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,55%{left:-50%} 100%{left:130%}}
.ibtn{width:42px; height:42px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--surface); border:var(--card-border); box-shadow:var(--shadow-sm); color:var(--text2); font-size:19px; flex:0 0 auto}
.ibtn:active{transform:translateY(1px)}
.ibtn .mkIc{width:21px; height:21px}
.seg{display:inline-flex; flex-wrap:wrap; gap:6px}
.seg button{min-height:40px; padding:0 14px; border-radius:999px; font-weight:800; font-size:14px; color:var(--text2); background:var(--sunken); border:1.5px solid var(--line)}
.seg button.on{background:var(--acc-soft); color:var(--acc-text); border-color:var(--acc-ring)}

/* ── 앱 틀 ── */
.app{max-width:1240px; margin:0 auto; padding:10px 16px 0}
.topbar{display:flex; align-items:center; gap:10px; padding:4px 0 12px; min-width:0}
.topbar .title{display:flex; align-items:center; gap:8px; min-width:0; flex:1 1 auto}
.topbar .title > div{min-width:0}
.logo{width:34px; height:34px; border-radius:11px; flex:0 0 auto; display:grid; place-items:center; background:linear-gradient(160deg,var(--btn-top),var(--btn-bot)); color:#fff; box-shadow:0 3px 0 var(--btn-edge)}
.logo .mkIc{width:22px; height:22px}
.title h1{margin:0; font-size:18px; font-weight:900; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.title small{display:block; font-size:11.5px; color:var(--text3); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.roundPill{flex:0 0 auto; display:inline-flex; align-items:baseline; gap:3px; padding:6px 11px; border-radius:999px; background:var(--surface); border:var(--card-border); box-shadow:var(--shadow-sm); font-weight:900; font-size:14px}
.roundPill small{font-size:11px; color:var(--text3); font-weight:800}
.note{border-radius:16px; padding:10px 12px; font-size:13px; font-weight:700; background:var(--sunken); color:var(--text2); line-height:1.45}
.note.warn{background:rgba(245,166,35,.14); color:var(--warn)}
.note.bad{background:rgba(214,51,92,.10); color:var(--bad)}
.note.good{background:rgba(24,146,95,.10); color:var(--good)}

/* 배치: 폰 = 한 줄(참가자 → 판 → 지금 할 일 → 내 자산 → 소식) · PC = 왼쪽·가운데·오른쪽 열이 서로 독립
   판과 '지금 할 일'은 한 덩어리(.playArea) — 소식이 아무리 쌓여도 둘 사이 간격은 --playGap */
.layout{display:flex; flex-direction:column; gap:12px; padding-bottom:24px; min-width:0}
.colL,.colM,.colR{display:contents}
.players{order:1}
.playArea{order:2}
.mine{order:3}
.feed{order:4}
.playArea{--playW:min(100%, max(260px, calc(100dvh - 330px))); --playGap:12px; display:flex; flex-direction:column; align-items:center; gap:var(--playGap); min-width:0; width:100%}

/* ── 참가자 띠 ── */
.players{display:grid; grid-template-columns:repeat(var(--n,4),minmax(0,1fr)); gap:7px; padding-top:8px}
.pchip{position:relative; min-width:0; display:flex; flex-direction:column; align-items:center; gap:1px; padding:9px 4px 8px; border-radius:18px; background:var(--surface); border:var(--card-border); box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s}
.pchip .av{width:36px; height:36px; position:relative}
.pchip .av svg{width:100%; height:100%}
.pchip .nm{font-size:12.5px; font-weight:800; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding:0 2px}
.pchip .amt{display:flex; align-items:center; gap:3px; font-size:13px; font-weight:900; font-variant-numeric:tabular-nums; white-space:nowrap}
.pchip .amt .coinIc{width:14px; height:14px}
.pchip .extra{display:none}
.pchip.me{background:linear-gradient(180deg,var(--surface),var(--surface2))}
.pchip .meTag{position:absolute; top:6px; right:6px; font-size:10px; font-weight:900; color:var(--acc-text); background:var(--acc-soft); border-radius:999px; padding:1px 5px}
.pchip .off{position:absolute; top:6px; left:6px; width:9px; height:9px; border-radius:50%; background:#B8AEB5; box-shadow:0 0 0 2px var(--surface)}
.pchip.turn{box-shadow:0 0 0 3px var(--acc), var(--shadow-sm); transform:translateY(-2px)}
.pchip.turn::before{content:"차례"; position:absolute; top:-9px; left:50%; transform:translateX(-50%); font-size:10.5px; font-weight:900; padding:1px 8px; border-radius:999px; background:var(--acc); color:var(--on-acc); white-space:nowrap}
.pchip.dead{filter:grayscale(1); opacity:.55}
.pchip .stamp{position:absolute; top:34%; left:50%; transform:translate(-50%,-50%) rotate(-14deg); font-size:13px; font-weight:900; color:var(--bad); border:2.5px solid var(--bad); border-radius:8px; padding:0 6px; background:var(--surface); white-space:nowrap; animation:stamp .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(2.4); opacity:0} 100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1); opacity:1}}
.pchip.bump{animation:bump .35s ease}
@keyframes bump{40%{transform:translateY(-2px) scale(1.05)}}
.coinIc{display:inline-block; width:18px; height:18px; flex:0 0 auto}
.coinIc svg{width:100%; height:100%; display:block}
.wcoin{display:inline-flex; align-items:center; gap:3px; color:var(--wcoin); font-weight:900}
.wcoin .mkIc{width:1.05em; height:1.05em}

/* ── 판 ── */
.boardWrap{position:relative; width:var(--playW); container-type:inline-size}
.board{
  --bpad:1.6cqw; --cellpad:.55cqw; --tile-r:2.2cqw;
  position:relative; aspect-ratio:1/1; width:100%;
  display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); grid-template-rows:repeat(7,minmax(0,1fr));
  padding:var(--bpad); border-radius:5.2cqw; background:var(--board-bg); border:var(--board-border); box-shadow:var(--board-shadow);
}
.cell{position:relative; padding:var(--cellpad); container-type:size; min-width:0; min-height:0}
.tile{position:relative; width:100%; height:100%; border-radius:var(--tile-r); background:var(--tile); border:var(--tile-border); box-shadow:var(--tile-shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; overflow:hidden; transition:background-color .3s}
.tile .band{position:absolute; left:0; right:0; top:0; height:15cqh; background:var(--band,transparent)}
.tile .own{position:absolute; left:0; right:0; bottom:0; height:12cqh; background:var(--pc,transparent); opacity:.95}
.tile .ic{width:44cqw; height:44cqw; color:var(--icc,var(--text2)); --icf:var(--icfill,transparent)}
.tile.prop{padding-top:13cqh}
.tile.owned{padding-bottom:10cqh}
.tile .ic .mkIc{width:100%; height:100%; stroke-width:1.9}
.tile .nm{margin-top:3cqh; font-size:clamp(8.5px, 19cqw, 14.5px); font-weight:800; letter-spacing:-.04em; line-height:1.05; max-width:94%; white-space:nowrap; overflow:hidden; color:var(--text)}
.tile .pr{display:none; margin-top:1.5cqh; font-size:clamp(8px, 13cqw, 11.5px); color:var(--text3); font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap}
.tile .lv{display:none; position:absolute; top:19cqh; right:6cqw; flex-direction:column-reverse; gap:2.5cqw}
.tile .lv i{width:7.5cqw; height:7.5cqw; border-radius:50%; background:var(--line2); display:block}
.tile .lv i.on{background:var(--pc)}
.tile .setMark{position:absolute; top:17cqh; left:6cqw; width:17cqw; height:17cqw; color:#E7A400; display:none}
.tile.set .setMark{display:block}
.tile .setMark svg{width:100%; height:100%; display:block}
@container (min-width:64px){
  .tile .pr{display:block}
  .tile.owned .lv{display:flex}
  .tile.owned .pr{display:none}
  .tile .bld{width:42cqw; height:42cqw}
  .tile.start .pr{display:block}
}
.tile.prop{--band:var(--tb)}
.tile.ev{background:var(--ev); --icc:var(--evi); --icfill:var(--evf)}
.tile.rest{background:var(--rest); --icc:var(--resti); --icfill:var(--restf)}
.tile.start{background:var(--start-bg); --icc:#B0397A; --icfill:#FFFFFF}
.tile.start .nm{font-size:clamp(9px, 21cqw, 16px); font-weight:900}
.tile.start .pr{color:var(--acc-text)}
.tile.corner .ic{width:46cqw; height:46cqw}
.tile.owned{background:color-mix(in srgb, var(--pc) 17%, var(--tile))}
.tile .bld{width:48cqw; height:48cqw; transform-origin:50% 100%}
.tile .bld svg{width:100%; height:100%; overflow:visible}
.tile .bld.grow{animation:grow .75s cubic-bezier(.3,1.7,.5,1) both}
@keyframes grow{0%{transform:scale(.15) translateY(18%); opacity:0} 55%{transform:scale(1.18); opacity:1} 100%{transform:scale(1)}}
.tile .bld.crumble{animation:crumble .7s ease-in both}
@keyframes crumble{0%{transform:none} 20%{transform:rotate(-8deg)} 40%{transform:rotate(7deg) translateY(4%)} 100%{transform:rotate(-20deg) translateY(60%) scale(.3); opacity:0}}
.cell.hot .tile{box-shadow:0 0 0 3px var(--acc), var(--tile-shadow); animation:hot 1.1s ease-in-out infinite}
@keyframes hot{50%{box-shadow:0 0 0 5px var(--acc-ring), var(--tile-shadow)}}

/* 가운데 무대 */
.center{grid-area:2 / 2 / 7 / 7; position:relative; margin:var(--cellpad); border-radius:calc(var(--tile-r) + 1.2cqw); background:var(--center-bg); border:1.5px dashed var(--center-line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.2cqh; container-type:size; overflow:hidden; text-align:center}
.stage{display:flex; flex-direction:column; align-items:center; gap:2.5cqh; width:100%}
.stageTop{display:flex; align-items:center; gap:3cqw; min-height:26cqh}
.stageStk{width:28cqh; height:28cqh; object-fit:contain; filter:drop-shadow(0 3px 6px rgba(0,0,0,.12))}
.stageStk.pop{animation:stkPop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stkPop{0%{transform:scale(.4) rotate(-8deg); opacity:0} 100%{transform:none; opacity:1}}
.stageText{display:flex; flex-direction:column; align-items:flex-start; gap:.5cqh; text-align:left; max-width:52cqw}
.stageText b{font-size:clamp(13px, 7.4cqw, 26px); font-weight:900; letter-spacing:-.03em; line-height:1.15}
.stageText span{font-size:clamp(10.5px, 4.2cqw, 15px); color:var(--text2); font-weight:700; line-height:1.3}
.diceRow{display:flex; gap:6cqw; align-items:center; justify-content:center; height:30cqh}
.sumBubble{position:absolute; left:50%; top:62%; transform:translate(-50%,-50%); font-size:clamp(14px, 9cqw, 34px); font-weight:900; color:var(--acc-text); background:var(--surface); border:var(--card-border); border-radius:999px; padding:.1em .6em; box-shadow:var(--shadow-sm); animation:sumPop .55s cubic-bezier(.3,1.6,.5,1) both; pointer-events:none; white-space:nowrap}
.sumBubble.dbl{background:linear-gradient(180deg,#FFF1A8,#FFD25A); color:#6B3E00}
@keyframes sumPop{0%{transform:translate(-50%,-30%) scale(.3); opacity:0} 100%{transform:translate(-50%,-50%) scale(1); opacity:1}}
.stageMini{font-size:clamp(10px, 3.9cqw, 14px); color:var(--text3); font-weight:700; max-width:90%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.die{width:21cqh; height:21cqh; perspective:600px; position:relative}
.cube{position:absolute; inset:0; transform-style:preserve-3d; transform:rotateX(-18deg) rotateY(24deg)}
.face{position:absolute; inset:0; border-radius:22%; background:linear-gradient(145deg,#FFFFFF,#FFEFF6); border:1.5px solid #F2CFE0; box-shadow:inset 0 -3px 0 rgba(0,0,0,.06); display:grid; grid-template:repeat(3,1fr)/repeat(3,1fr); padding:14%; backface-visibility:hidden}
.face i{width:72%; height:72%; margin:auto; border-radius:50%; background:#3A2C40; display:block}
.face i.r{background:#FF4D8D}
.f1{transform:translateZ(10.5cqh)} .f6{transform:rotateY(180deg) translateZ(10.5cqh)} .f3{transform:rotateY(90deg) translateZ(10.5cqh)}
.f4{transform:rotateY(-90deg) translateZ(10.5cqh)} .f2{transform:rotateX(90deg) translateZ(10.5cqh)} .f5{transform:rotateX(-90deg) translateZ(10.5cqh)}
.dieShadow{position:absolute; left:10%; right:10%; bottom:-9%; height:12%; border-radius:50%; background:rgba(40,20,40,.16); filter:blur(2px)}

/* 말 */
.tokens{position:absolute; inset:var(--bpad); pointer-events:none; z-index:5}
.tok{position:absolute; left:0; top:0; width:calc(100% / 7 * .62); aspect-ratio:1/1; transform:translate(-50%,-58%); transform-origin:50% 100%; transition:left .28s cubic-bezier(.3,.8,.4,1), top .28s cubic-bezier(.3,.8,.4,1); z-index:1}
.tok.hopping{transition:none; z-index:3}
.tok .body{position:relative; width:100%; height:100%}
.tok .body svg{width:100%; height:100%; overflow:visible}
.tok.turn{z-index:2}
.tok.turn .body{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9%)}}
.tok.turn::after{content:""; position:absolute; left:14%; right:14%; bottom:-6%; height:16%; border-radius:50%; background:radial-gradient(closest-side, var(--acc-ring), transparent); z-index:-1}
.tok .meTag{position:absolute; left:50%; top:-38%; transform:translateX(-50%); font-size:clamp(8.5px, 2.4cqw, 12px); font-weight:900; line-height:1.3; padding:0 .55em; border-radius:999px; background:var(--acc); color:var(--on-acc); white-space:nowrap; box-shadow:0 2px 4px rgba(0,0,0,.15)}
.tok.dead{display:none}
.chara .ch-body,.chara .ch-ear{fill:var(--pc); stroke:var(--pcs); stroke-width:var(--tok-line)}
.chara .ch-face{fill:#FFFFFF}
.chara .ch-eye{fill:#2B2230}
.chara .ch-blush{fill:#FFB39B}
.chara .ch-mouth{fill:none; stroke:#2B2230; stroke-width:1.3; stroke-linecap:round}
.chara .ch-shine{fill:#FFFFFF; opacity:.55}
.chara .ch-shadow{fill:rgba(40,20,40,.18)}

/* 카드 */
.cardLayer{position:absolute; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; pointer-events:none}
.cardLayer.on{pointer-events:auto}
.cardLayer.on::before{content:""; position:absolute; inset:-2px; border-radius:5.2cqw; background:var(--scrim); animation:fadeIn .2s ease both}
@keyframes fadeIn{from{opacity:0}}
.gcard{position:relative; width:min(88%, 340px); border-radius:24px; background:var(--surface); border:var(--card-border); box-shadow:var(--shadow); overflow:hidden; animation:cardIn .42s cubic-bezier(.3,1.5,.5,1) both}
@keyframes cardIn{0%{transform:translateY(12%) scale(.8); opacity:0} 100%{transform:none; opacity:1}}
@keyframes cardOut{to{transform:translateY(8%) scale(.9); opacity:0}}
.gcTop{position:relative; padding:14px 16px 12px; background:var(--gc-bg,var(--surface2)); display:flex; align-items:center; gap:12px; min-height:92px}
.gcTop.hasStk .gcTitle{padding-right:62px}
.gcArt{width:68px; height:68px; flex:0 0 auto; border-radius:18px; background:var(--surface); display:grid; place-items:center; box-shadow:var(--shadow-sm); color:var(--gc-ic,var(--text2)); --icf:var(--gc-f,transparent)}
.gcArt .mkIc{width:44px; height:44px; stroke-width:1.8}
.gcArt svg.bldSvg{width:52px; height:52px}
.gcTitle{min-width:0}
.gcTitle small{display:block; font-size:12px; font-weight:800; color:var(--text2)}
.gcTitle b{display:block; font-size:19px; font-weight:900; letter-spacing:-.03em; line-height:1.2; word-break:keep-all}
.gcStk{position:absolute; right:6px; bottom:-10px; width:76px; height:76px; object-fit:contain; filter:drop-shadow(0 3px 5px rgba(0,0,0,.14)); animation:stkPop .5s .15s cubic-bezier(.3,1.6,.5,1) both}
.gcBody{padding:14px 16px 16px; display:grid; gap:9px}
.gcRow{display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:14px; color:var(--text2); font-weight:700}
.gcRow b{color:var(--text); font-size:15.5px; font-weight:900; font-variant-numeric:tabular-nums}
.gcRow b.plus{color:var(--good)}
.gcBig{font-size:28px; font-weight:900; letter-spacing:-.02em; text-align:center; font-variant-numeric:tabular-nums}
.gcBig.plus{color:var(--good)}
.gcBig.minus{color:var(--bad)}
.gcNote{font-size:13px; color:var(--text2); text-align:center; font-weight:700}
.gcTag{display:inline-block; font-size:11.5px; font-weight:900; padding:2px 8px; border-radius:999px; background:#FFF1B5; color:#8A5A00; margin-left:4px}
.ladCap{font-size:12px; font-weight:800; color:var(--text3); margin-bottom:-3px}
.ladder{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.ladder div{border-radius:12px; background:var(--sunken); padding:6px 4px; text-align:center; font-size:11.5px; font-weight:800; color:var(--text2); border:1.5px solid transparent}
.ladder div svg{width:26px; height:26px; margin:0 auto 1px; display:block; overflow:visible}
.ladder div b{display:block; color:var(--text); font-size:13px; font-variant-numeric:tabular-nums}
.ladder div.now{border-color:var(--acc); background:var(--acc-soft)}
.ladder div.next{border-style:dashed; border-color:var(--acc-ring)}
.gcOwner{display:flex; align-items:center; gap:8px}
.gcOwner .av{width:26px; height:26px}
.flipBox{perspective:1000px; width:min(88%, 340px)}
.flipIn{position:relative; transform-style:preserve-3d; transition:transform .75s cubic-bezier(.3,1.35,.5,1)}
.flipBox.open .flipIn{transform:rotateY(180deg)}
.flipBox .gcard{width:100%; animation:none; backface-visibility:hidden}
.flipBox .back{position:absolute; inset:0; border-radius:24px; backface-visibility:hidden; background:repeating-linear-gradient(45deg, var(--btn-top) 0 14px, var(--btn-bot) 14px 28px); border:var(--card-border); box-shadow:var(--shadow); display:grid; place-items:center; animation:cardIn .42s cubic-bezier(.3,1.5,.5,1) both}
.flipBox .back .q{width:96px; height:96px; border-radius:50%; background:rgba(255,255,255,.92); display:grid; place-items:center; font-size:52px; font-weight:900; color:var(--acc-text); box-shadow:0 6px 0 rgba(0,0,0,.08)}
.flipBox .front{transform:rotateY(180deg)}

/* 지금 할 일 */
.dock{position:relative; z-index:15; width:var(--playW); border:var(--card-border); border-radius:22px; background:var(--surface); box-shadow:var(--shadow-sm); padding:12px 14px 14px}
.dockMsg{display:flex; align-items:center; gap:8px; margin-bottom:9px; min-height:26px; min-width:0}
.dockMsg .now{flex:0 0 auto; font-size:11.5px; font-weight:900; color:var(--acc-text); background:var(--acc-soft); padding:3px 9px; border-radius:999px}
.dockMsg .now.wait{color:var(--text2); background:var(--sunken)}
.dockMsg .txt{font-size:15.5px; font-weight:800; letter-spacing:-.02em; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dockMsg .av{width:24px; height:24px; flex:0 0 auto}
.dockBtns{display:flex; gap:8px; flex-wrap:wrap}
.dockBtns .btn.big{flex:1 1 auto; min-width:0}
.dockBtns .btn.big.sub{flex:0 0 auto; background:var(--btn2-bg); color:var(--text); box-shadow:0 4px 0 var(--btn2-edge); border:var(--card-border)}
.dockBtns .pick{flex:1 1 0; min-width:0; flex-direction:column; gap:2px; min-height:64px; padding:6px 4px; border-radius:18px}
.dockBtns .pick .av{width:28px; height:28px}
.dockBtns .pick span{font-size:13px; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.dockSub{margin-top:8px; font-size:12.5px; color:var(--text3); font-weight:700}
.dots::after{content:"…"; display:inline-block; animation:dots 1s steps(3) infinite; width:1.1em; text-align:left}
@keyframes dots{0%{clip-path:inset(0 66% 0 0)} 50%{clip-path:inset(0 33% 0 0)} 100%{clip-path:inset(0 0 0 0)}}
.spinDice .mkIc{animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 패널 */
.panel{background:var(--surface); border:var(--card-border); border-radius:22px; box-shadow:var(--shadow-sm); padding:14px 14px 12px; min-width:0}
.phead{display:flex; align-items:center; gap:8px; font-weight:900; font-size:15px; margin-bottom:10px}
.phead small{margin-left:auto; font-size:12px; color:var(--text3); font-weight:700}
.bigCoin{display:flex; align-items:center; gap:8px; font-size:30px; font-weight:900; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.bigCoin .coinIc{width:30px; height:30px}
.bigCoin small{font-size:15px; color:var(--text2)}
.assetLine{font-size:12.5px; color:var(--text3); font-weight:700; margin-top:2px}
.flash-up{animation:flashUp .7s ease}
.flash-down{animation:flashDown .7s ease}
@keyframes flashUp{30%{color:var(--good); transform:scale(1.06)}}
@keyframes flashDown{30%{color:var(--bad); transform:scale(.97)}}
.houses{display:grid; gap:6px; margin-top:10px; align-content:start; max-height:260px; overflow-y:auto; overscroll-behavior:contain; min-height:0}
.house{display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:14px; background:var(--sunken); font-size:13px; font-weight:700; min-width:0}
.house .sw{width:30px; height:30px; flex:0 0 auto}
.house .sw svg{width:100%; height:100%; overflow:visible}
.house .hn{min-width:0; flex:1 1 0; overflow:hidden}
.house .hn .hname,.house .hn small{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.house .hn small{color:var(--text3); font-size:11.5px}
.house .ht{flex:0 0 auto; min-width:68px; text-align:right; font-variant-numeric:tabular-nums; font-weight:900; color:var(--text2); white-space:nowrap; font-size:12.5px; line-height:1.25}
.house .ht small{display:block; font-size:10.5px; font-weight:800; color:var(--text3)}
.empty{font-size:13px; color:var(--text3); padding:6px 2px}
.bank{margin-top:10px; display:flex; align-items:center; gap:10px; padding:10px; border-radius:14px; border:1.5px dashed var(--line2); font-size:12.5px; color:var(--text2); font-weight:700; flex-wrap:wrap}
.bank .bt{flex:1 1 150px; min-width:0}
.bank .bt b{color:var(--text)}
.feedList{display:grid; gap:0; align-content:start; max-height:var(--feedH,320px); overflow-y:auto; overscroll-behavior:contain; min-height:0}   /* start: 소식이 적어도 줄 사이가 벌어지지 않게(PC 칸 높이가 정해져 있을 때) */
.fi{display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13px; font-weight:600; color:var(--text2); min-width:0}
.fi:last-child{border-bottom:0}
.fi .av{width:20px; height:20px; flex:0 0 auto; margin-top:1px}
.fi .ft{min-width:0; overflow-wrap:anywhere}
.fi .ft b{color:var(--text)}
.fi.new{animation:feedIn .35s ease both}
@keyframes feedIn{from{transform:translateY(-6px); opacity:0}}

/* 효과 */
.fx{position:fixed; inset:0; pointer-events:none; z-index:60; overflow:hidden}
.flyCoin{position:fixed; left:0; top:0; width:22px; height:22px; margin:-11px 0 0 -11px; will-change:transform}
.flyCoin svg{width:100%; height:100%}
.floatTxt{position:fixed; left:0; top:0; transform:translate(-50%,-50%); font-weight:900; font-size:17px; white-space:nowrap; color:var(--good); text-shadow:0 1px 0 var(--surface), 0 0 6px var(--surface); font-variant-numeric:tabular-nums}
.floatTxt.minus{color:var(--bad)}
.floatTxt small{display:block; font-size:11px; font-weight:800; color:var(--text2); text-align:center}
.puff{position:absolute; width:calc(100% / 7 * .5); aspect-ratio:2/1; transform:translate(-50%,-20%); pointer-events:none; z-index:0}
.puff i{position:absolute; bottom:0; width:34%; aspect-ratio:1; border-radius:50%; background:var(--surface); border:1px solid var(--line); opacity:.9; animation:puff .45s ease-out forwards}
.puff i:nth-child(1){left:0; --dx:-60%} .puff i:nth-child(2){left:33%; --dx:0%} .puff i:nth-child(3){right:0; --dx:60%}
@keyframes puff{to{transform:translate(var(--dx),-40%) scale(.2); opacity:0}}
.spark{position:absolute; width:calc(100% / 7 * .22); aspect-ratio:1; pointer-events:none; z-index:6; transform:translate(-50%,-50%); color:#FFC83D; animation:spark .7s ease-out forwards}
.spark svg{width:100%; height:100%}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(.2) rotate(0)} 60%{transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(1.1) rotate(60deg); opacity:1} 100%{transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) scale(.3) rotate(90deg); opacity:0}}
.handoff{position:absolute; left:50%; top:50%; z-index:25; transform:translate(-50%,-50%); display:flex; align-items:center; gap:10px; padding:10px 20px 10px 12px; border-radius:999px; background:var(--surface); border:var(--card-border); box-shadow:var(--shadow); white-space:nowrap; font-size:clamp(15px, 4.4cqw, 22px); font-weight:900; letter-spacing:-.02em; pointer-events:none}
.handoff .av{width:clamp(30px, 8cqw, 44px); height:clamp(30px, 8cqw, 44px)}
.handoff.me{background:linear-gradient(180deg,var(--btn-top),var(--btn-bot)); color:var(--on-acc)}
.toast{position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:90; background:var(--text); color:var(--page); padding:9px 16px; border-radius:999px; font-weight:800; font-size:13.5px; box-shadow:var(--shadow); max-width:calc(100vw - 32px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; animation:toastIn .25s ease both}
@keyframes toastIn{from{transform:translate(-50%,10px); opacity:0}}

/* 로비 */
.lobby{max-width:640px; margin:0 auto; padding:0 0 40px}
.lobbyCard{background:var(--surface); border:var(--card-border); border-radius:28px; box-shadow:var(--shadow); padding:18px 16px 16px; display:grid; gap:14px}
.lobbyHero{display:flex; align-items:center; gap:12px}
.lobbyHero img{width:92px; height:92px; flex:0 0 auto; object-fit:contain; filter:drop-shadow(0 4px 8px rgba(0,0,0,.12))}
.lobbyHero h2{margin:0; font-size:23px; font-weight:900; letter-spacing:-.04em}
.lobbyHero p{margin:2px 0 0; font-size:13.5px; color:var(--text2); font-weight:700}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border-radius:999px; background:var(--sunken); font-size:12.5px; font-weight:800; color:var(--text2); border:1px solid var(--line)}
.chip .mkIc{width:15px; height:15px}
.chip.acc{background:var(--acc-soft); color:var(--acc-text); border-color:var(--acc-ring)}
.seats{display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:8px}
.seat{position:relative; min-width:0; border-radius:18px; padding:12px 6px 10px; text-align:center; background:var(--surface2); border:var(--card-border); display:flex; flex-direction:column; align-items:center; gap:4px}
.seat .av{width:46px; height:46px}
.seat .sn{font-size:13.5px; font-weight:900; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.seat .ss{font-size:11.5px; font-weight:800; color:var(--good)}
.seat .ss.wait{color:var(--warn)}
.seat.me{box-shadow:0 0 0 2.5px var(--acc)}
.seat .off{position:absolute; top:8px; left:8px; width:9px; height:9px; border-radius:50%; background:#B8AEB5}
.seat.emptySeat{background:transparent; border:2px dashed var(--line2); color:var(--text3); justify-content:center; min-height:112px}
.seat.emptySeat .plus{width:40px; height:40px; border-radius:50%; border:2px dashed var(--line2); display:grid; place-items:center; font-size:22px; font-weight:900}
.lobbyActs{display:grid; gap:8px}
.lobbyNote{font-size:12.5px; color:var(--text3); text-align:center; font-weight:700}
.profileNote{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:16px; background:var(--sunken); font-size:13px; font-weight:700; color:var(--text2); min-width:0}
.profileNote .av{width:30px; height:30px; flex:0 0 auto}
.profileNote b{color:var(--text)}
.profileNote span{min-width:0; overflow:hidden; text-overflow:ellipsis}
.profileNote .edit{margin-left:auto; color:var(--acc-text); font-weight:800; font-size:12.5px; white-space:nowrap}
.orderRolls{display:grid; gap:6px}
.orderRolls div{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:var(--sunken); font-weight:800}
.orderRolls .av{width:28px; height:28px}
.orderRolls .dz{margin-left:auto; display:flex; gap:4px}
.orderRolls .dz i{width:26px; height:26px; border-radius:8px; background:var(--surface); border:var(--card-border); display:grid; place-items:center; font-style:normal; font-weight:900}
.orderRolls .no{font-size:12px; color:var(--acc-text); font-weight:900; width:30px}

/* 시트(아래에서 올라오는 창 · PC는 가운데) */
.sheetWrap{position:fixed; inset:0; z-index:85; background:var(--scrim); display:flex; align-items:flex-end; justify-content:center; animation:fadeIn .2s ease both}
.sheet{width:min(100%, 560px); max-height:88vh; overflow:auto; background:var(--surface); border-radius:26px 26px 0 0; border:var(--card-border); box-shadow:var(--shadow); padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px)); animation:sheetIn .3s cubic-bezier(.3,1.2,.5,1) both}
@keyframes sheetIn{from{transform:translateY(40%)}}
.sheet .grab{width:44px; height:5px; border-radius:99px; background:var(--line2); margin:0 auto 10px}
.sheet h3{margin:0 0 6px; font-size:19px; font-weight:900; letter-spacing:-.02em}
.sheet p{margin:0 0 10px; color:var(--text2); font-weight:600; font-size:14px}
.sheet .sec{margin:12px 0}
.sheet .sec > b{display:block; font-size:13.5px; margin-bottom:6px}
.sheet .btns{display:grid; gap:8px; margin-top:14px}
.sheet .btns.two{grid-template-columns:1fr 1fr}
.field{width:100%; min-height:46px; border-radius:14px; border:1.5px solid var(--line2); background:var(--surface); padding:0 14px; font-size:16px; font-weight:700}
.field:focus{outline:none; border-color:var(--acc)}
.menuList{display:grid; gap:6px}
.menuList .btn{justify-content:flex-start}
.rules{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px}
.rule{border-radius:16px; background:var(--sunken); padding:10px 11px; font-size:12.5px; color:var(--text2); font-weight:600; line-height:1.4}
.rule .rh{display:block; color:var(--text); font-size:13.5px; font-weight:900; margin-bottom:3px}
.rule b{color:var(--text)}
.tollTable{width:100%; border-collapse:collapse; margin-top:12px; font-size:12.5px; font-variant-numeric:tabular-nums}
.tollTable th,.tollTable td{padding:6px 4px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap}
.tollTable th:first-child,.tollTable td:first-child{text-align:left}
.tollTable th{color:var(--text3); font-weight:800}
.tollTable td .sw{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px}

/* 결과(우승·정산) */
.win{position:fixed; inset:0; z-index:80; display:grid; place-items:center; padding:16px; background:var(--scrim); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); animation:fadeIn .3s ease both; overflow:auto}
.winCard{position:relative; width:min(100%, 400px); border-radius:28px; background:var(--surface); border:var(--card-border); box-shadow:var(--shadow); padding:22px 18px 18px; text-align:center; animation:cardIn .6s cubic-bezier(.3,1.5,.5,1) both; margin-top:60px}
.winStk{width:124px; height:124px; margin:-84px auto 0; object-fit:contain; filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.winAv{width:62px; height:62px; margin:6px auto 0; position:relative}
.winAv .crown{position:absolute; left:50%; top:-26px; transform:translateX(-50%) rotate(-8deg); width:38px; height:28px}
.winCard h2{margin:8px 0 2px; font-size:25px; font-weight:900; letter-spacing:-.03em}
.winCard .why{font-size:13px; color:var(--text2); font-weight:700}
.rank{list-style:none; margin:14px 0 12px; padding:0; display:grid; gap:6px; text-align:left}
.rank li{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:var(--sunken); font-weight:800; font-size:14px; min-width:0}
.rank li .no{width:24px; height:24px; border-radius:50%; display:grid; place-items:center; background:var(--surface); font-size:12.5px; flex:0 0 auto; border:var(--card-border)}
.rank li.first{background:linear-gradient(90deg,#FFF1B5,#FFE1EF); color:#2B2230}
.rank li.first .no{background:#FFD25A; color:#6B3E00; border-color:transparent}
.rank li .av{width:26px; height:26px; flex:0 0 auto}
.rank li .rn{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank li .ra{font-variant-numeric:tabular-nums; white-space:nowrap; text-align:right; font-size:13px}
.rank li .ra small{display:block; font-size:11.5px; color:var(--text3)}
.rank li.out .ra{color:var(--bad)}
.payout{margin:0 0 14px; padding:10px 12px; border-radius:16px; background:var(--acc-soft); color:var(--acc-text); font-weight:900; font-size:14.5px}
.payout small{display:block; font-weight:700; font-size:12px; color:var(--text2); margin-top:2px}
.winBtns{display:grid; grid-template-columns:1fr 1fr; gap:8px}
#confetti{position:fixed; inset:0; width:100%; height:100%; z-index:81; pointer-events:none}
.center-msg{max-width:520px; margin:40px auto; text-align:center; padding:24px 18px; background:var(--surface); border:var(--card-border); border-radius:26px; box-shadow:var(--shadow)}
.center-msg img{width:110px; height:110px; margin:0 auto 6px; object-fit:contain}
.center-msg h2{margin:4px 0 6px; font-size:21px; font-weight:900}
.center-msg p{margin:0 0 14px; color:var(--text2); font-weight:700}

@media (min-width:1000px){
  .app{padding:14px 20px 0}
  .title h1{font-size:21px}
  /* 세 열 높이 = 가운데 열(판 + 지금 할 일). 옆 두 열은 contain:size라 행 높이를 키우지 못하고, 그 높이로 늘어나 각 칸 안에서 스크롤 */
  .layout{display:grid; grid-template-columns:272px minmax(0,1fr) 300px; gap:22px; align-items:stretch}
  .colL,.colR{display:flex; flex-direction:column; gap:14px; min-width:0; min-height:0; contain:size}
  .colM{display:block; min-width:0}
  .playArea{--playW:min(100%, max(420px, calc(100dvh - 190px)))}
  /* 참가자 칸은 줄어들 수 있고(flex-shrink) 내 자산은 내용만큼은 지킨다 → 5명 + 낮은 창에서도 집 목록이 두 줄은 보인다 */
  .players{grid-template-columns:minmax(0,1fr); gap:8px; padding:4px 5px 4px 3px; margin:-4px -5px -4px -3px; flex:0 1 auto; max-height:52%; min-height:96px; overflow-y:auto; overscroll-behavior:contain; align-content:start}
  .mine{flex:1 1 0; min-height:auto; display:flex; flex-direction:column}
  .mine .houses{flex:1 1 auto; max-height:none; min-height:108px; contain:size}   /* size: 집이 많아도 내 자산 칸을 키우지 않고 칸 안에서 스크롤 */
  .mine .bank{flex:0 0 auto}
  .feed{flex:1 1 auto; min-height:0; display:flex; flex-direction:column}
  .feed .feedList{flex:1 1 auto; max-height:none}
  .pchip{flex-direction:row; align-items:center; gap:10px; padding:10px 12px; border-radius:18px; text-align:left}
  .pchip .av{width:44px; height:44px; flex:0 0 auto}
  .pchip .nm{font-size:14.5px; padding:0}
  .pchip .who{min-width:0; flex:1 1 auto; display:flex; flex-direction:column}
  .pchip .amt{font-size:15px}
  .pchip .extra{display:block; font-size:12px; color:var(--text3); font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pchip.turn{transform:translateX(3px)}
  .pchip.turn::before{top:50%; left:auto; right:10px; transform:translateY(-50%)}
  .pchip .meTag{top:auto; bottom:8px; right:10px}
  .pchip.turn .meTag{display:none}
  .pchip .stamp{top:50%; left:36px}
  .toast{bottom:40px}
  .sheetWrap{align-items:center}
  .sheet{border-radius:26px; max-height:84vh}
}
@media (min-width:1000px) and (max-width:1199px){
  /* 좁은 PC(1000~1199): 옆 두 열을 조금 줄여 가운데 판이 420px 아래로 줄지 않게(1000에서 344px로 작아지던 것) */
  .layout{grid-template-columns:236px minmax(0,1fr) 256px; gap:16px}
}
@media (max-width:480px){
  .ibtn{width:38px; height:38px; font-size:17px}
  .ibtn .mkIc{width:19px; height:19px}
  .logo{width:30px; height:30px; border-radius:10px}
  .logo .mkIc{width:19px; height:19px}
  .title h1{font-size:16.5px}
  .topbar{gap:7px}
  .roundPill{padding:5px 9px; font-size:13px}
  .roundPill .lbl{display:none}
}
@media (max-width:370px){
  .title small{display:none}
  .pchip .nm{font-size:11.5px}
  .pchip .amt{font-size:12px}
}
@media (prefers-reduced-motion:reduce){
  .btn.shine::after,.tok.turn .body,.cell.hot .tile{animation:none}
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <button class="ibtn" type="button" id="btnBack" aria-label="수다방으로"></button>
    <div class="title"><span class="logo"><svg class="mkIc" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle class="pip" cx="8.5" cy="8.5" r="1.3"/><circle class="pip" cx="12" cy="12" r="1.3"/><circle class="pip" cx="15.5" cy="15.5" r="1.3"/></svg></span>
      <div><h1>마마코인 부루마블</h1><small id="subTitle">오늘의 수다방 한 판</small></div></div>
    <span class="roundPill" id="roundPill" hidden><span class="num" id="roundNow">1</span><small>/ <span id="roundMax">20</span><span class="lbl"> 라운드</span></small></span>
    <button class="ibtn" type="button" id="btnMenu" aria-label="메뉴"></button>
  </header>

  <!-- 안내(수다 세션 없음 · 불러오는 중 · 오류) -->
  <section id="scrMsg" class="center-msg" hidden>
    <img id="msgStk" alt="">
    <h2 id="msgTitle">판을 불러오는 중</h2>
    <p id="msgText">잠깐만요…</p>
    <div id="msgBtns"></div>
  </section>

  <!-- 로비 -->
  <section id="scrLobby" class="lobby" hidden>
    <div class="lobbyCard" id="lobbyCard"></div>
  </section>

  <!-- 게임 -->
  <section id="scrGame" hidden>
    <div class="layout">
      <div class="colL">
        <div class="players" id="players"></div>
        <div class="panel mine" id="mine"></div>
      </div>
      <div class="colM"><div class="playArea" id="playArea">
        <div class="boardWrap" id="boardWrap">
          <div class="board" id="board">
            <div class="center" id="center">
              <div class="stage" id="stage">
                <div class="stageTop"><img class="stageStk" id="stageStk" alt=""><div class="stageText"><b id="stageTitle"></b><span id="stageSub"></span></div></div>
                <div class="diceRow" id="diceRow"></div>
                <div class="stageMini" id="stageMini"></div>
              </div>
            </div>
            <div class="tokens" id="tokens"></div>
          </div>
          <div class="cardLayer" id="cardLayer"></div>
        </div>
        <div class="dock" id="dock">
          <div class="dockMsg" id="dockMsg"></div>
          <div class="dockBtns" id="dockBtns"></div>
          <div class="dockSub" id="dockSub" hidden></div>
        </div>
      </div></div>
      <div class="colR">
        <div class="panel feed">
          <div class="phead">소식 <small>최근 순</small></div>
          <div class="feedList" id="feedList"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="fx" id="fx"></div>
<canvas id="confetti" hidden></canvas>
<div id="overlays"></div>
<div id="sheets"></div>

      + `<div class="sec"><b>판돈 <span style="font-weight:700;color:var(--text3);font-size:12px">작업방 코인 · 1인</span></b><div class="seg" id="ngStake"><button type="button" data-s="0" class="on">연습판</button>${presets.map((p) => `<button type="button" data-s="${p}">${fmt(p)}</button>`).join('')}<button type="button" data-s="custom">직접</button></div>`
      + `<input class="field" id="ngCustom" inputmode="numeric" placeholder="100~20,000 (100 단위)" hidden style="margin-top:8px"></div>`
      + `<div class="note" id="ngNote">연습판은 작업방 코인 없이 누구나 할 수 있어요.</div>`
      + `<div class="btns"><button class="btn primary big" type="button" id="ngGo">판 열기</button></div>`;
    const { wrap, close } = openSheet(html, (v) => resolve(v));
    const note = $('#ngNote', wrap), custom = $('#ngCustom', wrap);
    const setNote = () => { note.textContent = stake > 0 ? `참가하는 사람 모두 ${fmt(stake)} 작업방 코인을 걸어요. 끝나면 게임 자산(코인+집값) 비율대로 판돈을 나눠 가져요.` : '연습판은 작업방 코인 없이 누구나 할 수 있어요.'; };
    wrap.addEventListener('click', (e) => {
      const r = e.target.closest('[data-r]'); if (r) { rounds = +r.dataset.r; $$('#ngRounds button', wrap).forEach((b) => b.classList.toggle('on', b === r)); }
      const s = e.target.closest('[data-s]');
      if (s) { $$('#ngStake button', wrap).forEach((b) => b.classList.toggle('on', b === s)); if (s.dataset.s === 'custom') { custom.hidden = false; custom.focus(); stake = parseInt(custom.value.replace(/[^0-9]/g, ''), 10) || 0; } else { custom.hidden = true; stake = +s.dataset.s; } setNote(); }
      if (e.target.closest('#ngGo')) {
        if (!custom.hidden) stake = parseInt(custom.value.replace(/[^0-9]/g, ''), 10) || 0;
        if (!E.validStake(stake)) { note.textContent = '판돈은 0(연습판) 또는 100~20,000을 100 단위로 적어 주세요'; note.className = 'note warn'; return; }
        close({ rounds, stake });
      }
    });
    custom.addEventListener('input', () => { stake = parseInt(custom.value.replace(/[^0-9]/g, ''), 10) || 0; setNote(); });
  });
}
function menuSheet() {
  const me = S ? mySeat() : null;
  const html = `<div class="grab"></div><h3>메뉴</h3><div class="menuList">`
    + `<button class="btn" type="button" data-m="rules">${icon('book')}규칙 보기</button>`
    + `<div class="sec"><b>화면</b><div class="seg" id="mTheme">${[['auto', '자동'], ['light', '라이트'], ['dark', '다크']].map(([v, l]) => `<button type="button" data-t="${v}" class="${themePref === v ? 'on' : ''}">${l}</button>`).join('')}</div></div>`
    + `<button class="btn" type="button" data-m="sound">${icon(SOUND ? 'snd' : 'mute')}소리 ${SOUND ? '끄기' : '켜기'}</button>`
    + (me && S && S.phase !== 'OVER' && !F ? `<button class="btn danger" type="button" data-m="leave">${icon('door')}${S.phase === 'LOBBY' ? '자리에서 나가기' : '판에서 나가기'}</button>` : '')
    + (!EMBED ? `<button class="btn" type="button" data-m="suda">${icon('back')}수다방으로</button>` : '')
    + '</div>';
  const { wrap, close } = openSheet(html);
  wrap.addEventListener('click', (e) => {
    const t = e.target.closest('[data-t]'); if (t) { applyTheme(t.dataset.t); LS.set(THEME_KEY, themePref); $$('#mTheme button', wrap).forEach((b) => b.classList.toggle('on', b === t)); return; }
    const m = e.target.closest('[data-m]'); if (!m) return;
    const k = m.dataset.m; close();
    if (k === 'rules') rulesSheet();
    else if (k === 'sound') { SOUND = !SOUND; LS.set('mk_marble_sound_v1', SOUND ? '1' : '0'); toast(SOUND ? '소리를 켰어요' : '소리를 껐어요'); }
    else if (k === 'leave') leaveFlow();
    else if (k === 'suda') goSuda();
  });
}
function rulesSheet() {
  const rules = [
    ['시작', `모두 <b>${fmt(E.START_COINS)}코인</b>으로 시작 · 2~5명 · 10·20·30라운드(여는 사람이 골라요)`],
    ['순서', '처음에 다 같이 주사위를 굴려 큰 수부터'],
    ['한 바퀴', `출발을 지나면 <b>+${E.PASS_BONUS}</b>, 딱 도착하면 <b>+${E.LAND_BONUS}</b> 더(합 1,300)`],
    ['집', '빈 땅은 사고, 내 집은 올리고(월세→자가→펜트하우스), 남의 집이면 통행료'],
    ['세트', '같은 단계 두 칸을 모두 가지면 그 두 칸 통행료 <b>×1.5</b>'],
    ['모자라면', '내 집을 <b>반값</b>에 자동으로 팔아 버텨요(싼 집부터) · 그래도 모자라면 파산'],
    ['이벤트 칸', '카드를 뒤집어요 · 영감·도서관·보너스는 +, 관리비·편집부·마감은 −'],
    ['편집부', '−600 · 대신 다음에 출발을 지날 때 +1,000 더'],
    ['슬럼프', '최대 2턴 쉬기 · 더블이 나오면 바로 탈출'],
    ['이사', '앞으로 1~3칸 더 가요'],
    ['더블', '같은 눈이 나오면 한 번 더!'],
    ['은행', '2,000코인 이하일 때 3,000코인 빌리기(최대 2번) · 갚을 땐 3,300·3,450 · 못 갚은 빚은 끝날 때 먼저 갚아요'],
    ['우승', '마지막 1명이 남거나 라운드가 끝나면 <b>코인+집값</b>(빚 뺀 값) 1위'],
    ['판돈', '판돈 판은 모두 같은 금액을 걸고, 끝나면 자산 비율대로 나눠 가져요 · 파산·게임 중 나가기는 몫 없음 · 시작 전에 나가면 돌려받아요'],
    ['자리', '새로고침해도 자리는 그대로 · 차례인 사람이 끊기면 10초, 멈추면 60초 뒤 그 차례를 넘겨요'],
  ];
  const table = TIERS.map((tr, i) => `<tr><td><span class="sw" style="background:var(--t${i})"></span>${tr.name}</td><td>${fmt(tr.price)}</td><td>${fmt(E.tollAt(i, 1, false))}</td><td>${fmt(E.tollAt(i, 2, false))}</td><td>${fmt(E.tollAt(i, 3, false))}</td></tr>`).join('');
  const { wrap, close } = openSheet(`<div class="grab"></div><h3>${GAME_NAME} 규칙</h3><div class="rules">${rules.map(([h, b]) => `<div class="rule"><span class="rh">${h}</span>${b}</div>`).join('')}</div>`
    + `<table class="tollTable"><thead><tr><th>집</th><th>사는 값</th><th>월세</th><th>자가</th><th>펜트하우스</th></tr></thead><tbody>${table}</tbody></table>`
    + `<div class="btns"><button class="btn primary" type="button" data-v="1">알겠어요</button></div>`);
  wrap.addEventListener('click', (e) => { if (e.target.closest('[data-v]')) close(); });
}
function goSuda() {
  try { window.close(); } catch (e) {}
  setTimeout(() => { if (!document.hidden) location.href = SUDA_URL; }, 300);
}

/* ───────── 수다 창(embed) 메시지 ───────── */
function post(msg) {
  DBG.posts.push(msg);
  if (!EMBED) return;
  try { window.parent.postMessage(msg, ORIGIN); } catch (e) {}
}
function notifyTurn() {
  const mine = isMyTurn();
  if (mine === lastMine) return;
  const was = lastMine; lastMine = mine;
  document.title = mine ? `● 내 차례 · ${GAME_NAME}` : GAME_NAME;
  if (was === null && !mine) return;
  post({ type: 'marble:turn', mine });
}
window.addEventListener('message', (e) => {
  if (!EMBED || e.origin !== ORIGIN || e.source !== window.parent) return;
  const m = e.data;
  if (!m || typeof m !== 'object') return;
  if (m.type === 'marble:theme') {
    if (m.theme === 'light' || m.theme === 'dark') applyTheme(m.theme);
    if (m.accent !== undefined) applyAccent(normHex(m.accent || '') || accentNow());
  }
});

/* ───────── 시계(넘기기 · 강제 종료 · 예약 정리) ───────── */
const tried = {};
function once(key, ms) { const t = Date.now(); if (tried[key] && t - tried[key] < ms) return false; tried[key] = t; return true; }
async function clock() {
  if (!S || !FB || !GID) return;
  const now = nowMs();
  if (!F && S.phase !== 'OVER') {
    const why = E.forcedReason(S, now);
    if (why && once('freeze:' + GID, 5000)) { await txState((cur) => E.freeze(cur, { now: nowMs(), why })); return; }
  }
  if (S.phase === 'OVER' && !F && once('final:' + GID, 4000)) writeFinal();
  if (S.phase === 'PLAY' && !F && !busy) {
    const cur = S.order[S.turn], owner = S.seats[cur] && S.seats[cur].uid;
    if (owner && owner !== UID) {
      const online = isOnline(owner);
      const age = now - (S.tAt || 0);
      const why = !online && age >= E.SKIP_OFFLINE_MS ? 'offline' : age >= E.SKIP_STUCK_MS ? 'stuck' : null;
      if (why && once(`skip:${GID}:${S.seq}`, 6000)) {
        const seq = S.seq;
        setTimeout(() => { if (S && S.seq === seq && !F) txState((c) => E.skip(c, { now: nowMs(), why, seq })); }, Math.random() * 1500);
      }
    }
    if (screenNow() === 'game') { const w = waitInfo(); const sub = $('#dockSub'); if (sub && !isMyTurn()) { sub.hidden = !w; sub.textContent = w; } }
  }
  if (S.phase === 'LOBBY' && S.stake > 0) {   // 판돈 거는 중(예약)인데 주인이 30초 넘게 끊긴 자리 → 누구나 풀기(걸린 코인 없음)
    for (const id of E.activeSeats(S)) {
      const st = S.seats[id];
      if (st.staked !== false || st.uid === UID) continue;
      if (!isOnline(st.uid)) { offSince[st.uid] = offSince[st.uid] || Date.now(); if (Date.now() - offSince[st.uid] > 30000 && once('clear:' + id, 10000)) txState((c) => E.unseat(c, { uid: st.uid, now: nowMs() })); }
      else delete offSince[st.uid];
    }
  }
}

/* ───────── 누름 ───────── */
document.addEventListener('click', (e) => {
  const t = e.target.closest('button, [data-act]');
  if (!t) return;
  ac();
  if (t.id === 'btnBack') { if (!EMBED) goSuda(); return; }
  if (t.id === 'btnMenu') { menuSheet(); return; }
  const act = t.dataset.act;
  if (!act) return;
  if (['roll', 'buy', 'up', 'pass', 'bank_yes', 'loan', 'repay'].includes(act)) { doAct(act); return; }
  if (act === 'collab') { doAct('collab', { target: t.dataset.target }); return; }
  if (act === 'join') joinFlow();
  else if (act === 'start') startGame();
  else if (act === 'leave') leaveFlow();
  else if (act === 'newGame') { $('#overlays').innerHTML = ''; resultClosed = true; newGameFlow(); }
  else if (act === 'showResult') { resultClosed = false; showResult(); render(); }
  else if (act === 'closeResult') { $('#overlays').innerHTML = ''; resultClosed = true; render(); }
  else if (act === 'editName') askName(true);
  else if (act === 'findSeat') findSeatFlow();
  else if (act === 'reload') location.reload();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { const w = $$('.sheetWrap').pop(); if (w) w.remove(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && S) { V = viewFrom(S); render(); } });
let resizeRaf = 0;   // 창 크기가 바뀌어 참가자 칸이 줄어도 지금 차례 카드가 보이게
window.addEventListener('resize', () => { cancelAnimationFrame(resizeRaf); resizeRaf = requestAnimationFrame(() => keepInView($('#players'), $('.pchip.turn'))); });
window.addEventListener('storage', (e) => {
  if ((e.key === 'mk_accent_v1' || e.key === null) && !ACCENT_PARAM) applyAccent(accentNow());
  if (e.key === 'mk_profile_pref_v1' && screenNow() === 'lobby') render();
});

/* ───────── 시작 ───────── */
async function boot() {
  applyTheme(themePref);
  applyAccent(accentNow());
  buildBoard();
  renderHeader();
  if (!SID) { msgScreen('수다방에서 열어 주세요', '수다방의 [+] → 부루마블에서 열면 같은 방 사람들과 같이 할 수 있어요.', 'hello', `<a class="btn primary" href="${SUDA_URL}">수다방으로</a>`); return; }
  msgScreen('판을 불러오는 중', '잠깐만요…', 'checkin');
  const got = await Promise.race([fbReady, sleep(12000).then(() => null)]);
  if (!got) { msgScreen('연결이 안 돼요', '게임 서버에 연결하지 못했어요. 광고 차단기를 끄거나 새로고침해 주세요.', 'sulk', '<button class="btn primary" type="button" data-act="reload">새로고침</button>'); return; }
  FB = got;
  try { UID = (await ensureAnonAuth()).uid; } catch (e) { failScreen(e); return; }
  FB.onValue(dbRef('.info/serverTimeOffset'), (snap) => { OFFSET = Number(snap.val()) || 0; });
  FB.onValue(dbRef('.info/connected'), (snap) => { CONNECTED = snap.val() !== false; if (CONNECTED) presenceOn(); });
  booted = true;
  FB.onValue(dbRef(lobbyPath()), (snap) => {
    LOBBY = snap.val() || {};
    const cur = LOBBY.cur && /^[a-z0-9]{4,24}$/.test(LOBBY.cur) ? LOBBY.cur : null;
    if (cur !== GID) switchGame(cur); else render();
  }, (err) => failScreen(err));
  setInterval(() => { clock().catch((e) => DBG.errs.push('clock ' + String(e && e.message || e))); }, 1000);
  setTimeout(() => { checkMyOldGames().catch(() => {}); }, 2500);
}

/* ───────── 시험 손잡이(시험 도구가 __MB_TEST__를 먼저 넣을 때만) ───────── */
if (TEST) {
  window.__MB_DEBUG__ = {
    state: () => S, final: () => F, uid: () => UID, gid: () => GID, view: () => V, wallet: () => wallet, feed: () => FEED.map((f) => f.html),
    flow: () => ({ screen: screenNow(), phase: S ? S.phase : null, mine: isMyTurn(), pend: S && S.pend ? S.pend.k : null, busy: busy || stakeBusy, replaying, queue: queue.length, seated: !!mySeat(), seq: S ? S.seq : null, final: !!F, embed: EMBED, ready: booted && LOBBY !== null && (!LOBBY.cur || !!S) }),
    rig: (...faces) => { DBG.rig = faces.map((f) => (f - 0.5) / 6); },
    act: (a, extra) => doAct(a, extra || {}),
    fast: (on) => { SPEED = on ? 0 : (RM ? 0.35 : 1); },
    bridgeLog: () => DBG.bridge.slice(), posts: () => DBG.posts.slice(), errs: () => DBG.errs.slice(),
    clock: () => clock(), writeFinal: () => writeFinal(), checkOld: () => checkMyOldGames(),
    join: () => joinFlow(), start: () => startGame(), leave: () => leaveFlow(), newGame: () => newGameFlow(),
  };
}
boot();
})();
